name: kodex-product-infra

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME:-kodex}
      POSTGRES_USER: ${PRODUCT_DB_USER:-kodex}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in your env file}
    ports:
      - "${PRODUCT_DB_PORT:-5432}:5432"
    volumes:
      - kodex-product-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-api:
    profiles: ["product-api"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${PRODUCT_API_NODE_ENV:-development}
      KODEX_DISABLE_ENV_FILE: "1"
      DATABASE_URL: postgresql://${PRODUCT_DB_USER:-kodex}:${PRODUCT_DB_PASSWORD}@postgres:5432/${PRODUCT_DB_NAME:-kodex}
      PRODUCT_DB_SSL: disable
      PRODUCT_API_HOST: 0.0.0.0
      PRODUCT_API_PORT: 47832
      PRODUCT_API_ALLOWED_HOSTS: ${PRODUCT_API_ALLOWED_HOSTS:-127.0.0.1:47832,localhost:47832}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:47831,http://localhost:47831}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-replace_with_a_base64url_32_byte_secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KODEX_RAG_ENABLED: ${KODEX_RAG_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "${PRODUCT_API_PORT:-47832}:47832"

volumes:
  kodex-product-postgres:

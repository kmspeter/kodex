name: kodex-product-infra

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME:-kodex}
      POSTGRES_USER: ${PRODUCT_DB_ADMIN_USER:-kodex_bootstrap}
      POSTGRES_PASSWORD: ${PRODUCT_DB_ADMIN_PASSWORD:?set PRODUCT_DB_ADMIN_PASSWORD in your env file}
      PRODUCT_DB_APP_USER: ${PRODUCT_DB_APP_USER:-kodex_app}
      PRODUCT_DB_APP_PASSWORD: ${PRODUCT_DB_APP_PASSWORD:?set PRODUCT_DB_APP_PASSWORD in your env file}
      PRODUCT_DB_MIGRATION_USER: ${PRODUCT_DB_MIGRATION_USER:-kodex_migration}
      PRODUCT_DB_MIGRATION_PASSWORD: ${PRODUCT_DB_MIGRATION_PASSWORD:?set PRODUCT_DB_MIGRATION_PASSWORD in your env file}
    ports:
      - "${PRODUCT_DB_PORT:-5432}:5432"
    volumes:
      - kodex-product-postgres:/var/lib/postgresql/data
      - ./postgres/010-kodex-roles.sh:/docker-entrypoint-initdb.d/010-kodex-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-api:
    profiles: ["product-api"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        KODEX_RELEASE_COMMIT: ${KODEX_RELEASE_COMMIT:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${PRODUCT_API_NODE_ENV:-development}
      KODEX_DEPLOYMENT_PROFILE: production
      KODEX_DISABLE_ENV_FILE: "1"
      DATABASE_URL: postgresql://${PRODUCT_DB_APP_USER:-kodex_app}:${PRODUCT_DB_APP_PASSWORD}@postgres:5432/${PRODUCT_DB_NAME:-kodex}
      PRODUCT_DB_SSL: disable
      PRODUCT_API_HOST: 0.0.0.0
      PRODUCT_API_PORT: 47832
      PRODUCT_API_ALLOWED_HOSTS: ${PRODUCT_API_ALLOWED_HOSTS:-127.0.0.1:47832,localhost:47832}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:47831,http://localhost:47831}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-replace_with_a_base64url_32_byte_secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_PASSWORD_RESET_ENABLED: ${AUTH_PASSWORD_RESET_ENABLED:-false}
      AUTH_PASSWORD_RESET_DELIVERY_URL: ${AUTH_PASSWORD_RESET_DELIVERY_URL:-}
      AUTH_PASSWORD_RESET_PUBLIC_ORIGIN: ${AUTH_PASSWORD_RESET_PUBLIC_ORIGIN:-}
      AUTH_PASSWORD_RESET_DELIVERY_BEARER_TOKEN: ${AUTH_PASSWORD_RESET_DELIVERY_BEARER_TOKEN:-}
      AUTH_PASSWORD_RESET_DELIVERY_TIMEOUT_MS: ${AUTH_PASSWORD_RESET_DELIVERY_TIMEOUT_MS:-5000}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-60}
      AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_ATTEMPTS: ${AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_WINDOW_SECONDS:-3600}
      AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_BLOCK_SECONDS: ${AUTH_PASSWORD_RESET_REQUEST_RATE_LIMIT_BLOCK_SECONDS:-3600}
      AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_ATTEMPTS: ${AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_BLOCK_SECONDS: ${AUTH_PASSWORD_RESET_COMPLETE_RATE_LIMIT_BLOCK_SECONDS:-900}
      PRODUCT_RETENTION_PASSWORD_RESET_DAYS: ${PRODUCT_RETENTION_PASSWORD_RESET_DAYS:-30}
      PRODUCT_OPERATIONS_BEARER_TOKEN: ${PRODUCT_OPERATIONS_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KODEX_RAG_ENABLED: ${KODEX_RAG_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "${PRODUCT_API_PORT:-47832}:47832"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  product-db-migrate:
    profiles: ["migration"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        KODEX_RELEASE_COMMIT: ${KODEX_RELEASE_COMMIT:-}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KODEX_DEPLOYMENT_PROFILE: production
      KODEX_DISABLE_ENV_FILE: "1"
      PRODUCT_DB_MIGRATION_URL: postgresql://${PRODUCT_DB_MIGRATION_USER:-kodex_migration}:${PRODUCT_DB_MIGRATION_PASSWORD}@postgres:5432/${PRODUCT_DB_NAME:-kodex}
      PRODUCT_DB_APPLICATION_ROLE: ${PRODUCT_DB_APP_USER:-kodex_app}
      PRODUCT_DB_SSL: disable
    command: ["node", "packages/product-db/dist/cli.js"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kodex-product-postgres:
